<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="max-w-md bg-white p-6 rounded-lg shadow-lg text-center">
        <span class="material-symbols-outlined text-red-500 text-6xl">
            error
        </span>
        <h1 class="text-2xl font-bold text-gray-800 mt-4">Oops! Something went wrong.</h1>
        <p class="text-gray-600 mt-2">{{ message }}</p>
        <a href="/" class="mt-4 inline-block px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
            go back home
        </a>
    </div>
</body>
</html>
