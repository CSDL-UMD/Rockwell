[project]
name = "rockwell"
version = "0.1.0"
description = "Rockwell mimics a Twitter-like feed using Twitter authentication to study user interactions and includes attention checks to ensure engaged browsing."
authors = []
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (==0.115.8)",
    "uvicorn (==0.34.0)",
    "annotated-types (==0.7.0)",
    "anyio (==4.8.0)",
    "certifi (==2025.1.31)",
    "click (==8.1.8)",
    "dnspython (==2.7.0)",
    "email-validator (==2.2.0)",
    "fastapi-cli (==0.0.7)",
    "h11 (==0.14.0)",
    "httpcore (==1.0.7)",
    "httptools (==0.6.4)",
    "httpx (==0.28.1)",
    "idna (==3.10)",
    "jinja2 (==3.1.5)",
    "markdown-it-py (==3.0.0)",
    "markupsafe (==3.0.2)",
    "mdurl (==0.1.2)",
    "pydantic (==2.10.6)",
    "pydantic-core (==2.27.2)",
    "pygments (==2.19.1)",
    "python-dateutil (==2.9.0.post0)",
    "python-dotenv (==1.0.1)",
    "python-multipart (==0.0.20)",
    "pyyaml (==6.0.2)",
    "rich (==13.9.4)",
    "rich-toolkit (==0.13.2)",
    "shellingham (==1.5.4)",
    "six (==1.17.0)",
    "sniffio (==1.3.1)",
    "starlette (==0.45.3)",
    "typer (==0.15.1)",
    "typing-extensions (==4.12.2)",
    "uvloop (==0.21.0)",
    "watchfiles (==1.0.4)",
    "websockets (==14.2)",
    "aiohttp (>=3.11.14,<4.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
