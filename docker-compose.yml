version: "3.9"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/rockwell
    volumes:
      - .:/app
    networks:
      - rockwell-net

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rockwell
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rockwell-net

volumes:
  postgres_data:

networks:
  rockwell-net:
